[workspace]
resolver = "3"
members = [
    "crates/mm-model",
    "crates/mm-markdown",
    "crates/mm-store",
    "crates/mm-app",
    "crates/mm-api",
    "crates/mm-ws",
    # Generic Go-interop crates (docs/PLUGIN_PLAN.md, D3): publishable, MIT OR Apache-2.0, and
    # forbidden from depending on any mm-* crate.
    "crates/gobwire",
    "crates/gobwire-derive",
    "crates/go-netrpc",
    "crates/goplugin",
    # Mattermost plugin RPC surface (Apache-2.0, generated from server/public/plugin).
    "crates/mm-plugin",
    # Byte-exact ports of Go's image codecs, deflate and the imaging libraries Mattermost uses
    # (BSD-3-Clause AND MIT, from the Go standard library, boxes-ltd/imaging and bep/imagemeta);
    # forbidden from depending on any mm-* crate. mm-app drives it.
    "crates/goimage",
    # Byte-exact port of freetype-go's TrueType rasteriser and the font.Drawer over it
    # ((FTL OR GPL-2.0-or-later) AND BSD-3-Clause); forbidden from depending on any mm-* crate.
    "crates/gofont",
    # Byte-exact ports of the libraries Mattermost's e-mail is built from: Go's text/template and
    # html/template (BSD-3-Clause), jaytaylor/html2text over x/net/html's parser (MIT AND
    # BSD-3-Clause), and go-mail's writer with net/mail and net/smtp (MIT AND BSD-3-Clause).
    # Forbidden from depending on any mm-* crate. mm-app drives them.
    "crates/gotemplate",
    # x/net/html's tokenizer and tree builder, which gohtml2text parses with and mm-model's link
    # previews tokenize with (BSD-3-Clause).
    "crates/gohtml",
    "crates/gohtml2text",
    "crates/gomail",
    # Byte-exact port of yuin/goldmark v1.8.2 (MIT): CommonMark, the HTML renderer and GFM, which
    # Mattermost's push-notification text and notification e-mail HTML are rendered with.
    # Forbidden from depending on any mm-* crate. mm-app drives it.
    "crates/gogoldmark",
    # Byte-exact port of rsc.io/qr as github.com/mattermost/rsc vendors it (BSD-3-Clause): the QR
    # code and PNG of Mattermost's MFA enrolment. Forbidden from depending on any mm-* crate.
    "crates/goqr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# The licence is SPLIT, mirroring upstream's own split (see NOTICE and D-031):
#   - this default, AGPL-3.0-only, covers mm-store / mm-app / mm-api / mm-ws, which derive from
#     `server/channels/` — the AGPL v3.0 half of the Mattermost tree;
#   - `crates/mm-model` and `crates/mm-markdown` OVERRIDE it back to Apache-2.0, because they
#     derive solely from `server/public/`, which upstream licenses under Apache-2.0.
# A crate that starts consuming `server/channels/` source must drop its override, not add one.
license = "AGPL-3.0-only"
repository = "https://github.com/niklabh/mattermost-rs"

[workspace.dependencies]
# The machine's own interface addresses, for the outbound-connection guard's `IsOwnIP`.
if-addrs = "0.13"
# Internal crates. Dependency direction is strict and enforced by review:
#   mm-model <- mm-store <- mm-app <- {mm-api, mm-ws}
mm-model = { path = "crates/mm-model" }
mm-plugin = { path = "crates/mm-plugin" }
# Apache-2.0 like mm-model; depends on nothing. The mention engine (mm-app) consumes it.
mm-markdown = { path = "crates/mm-markdown" }
mm-store = { path = "crates/mm-store" }
mm-app = { path = "crates/mm-app" }
goimage = { path = "crates/goimage" }
gohtml = { path = "crates/gohtml", version = "0.1.0" }

# Runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = "0.8"

# The Strangler Fig proxy's forward leg. rustls rather than native-tls so the build has no
# OpenSSL dependency, matching the sqlx feature choice. No default features: the cookie store,
# redirect following and gzip layers would all change what the proxy forwards, and the proxy must
# hand the Go server's answer back unaltered.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
# Body plumbing for the proxy: axum's `Body` and reqwest's are different types.
http-body-util = "0.1"

# The local-mode API's forward leg. `reqwest` cannot dial a unix socket and the pinned feature set
# exists to stop it rewriting what it forwards, so the socket proxy drives HTTP/1 over a
# `tokio::net::UnixStream` directly. Both crates are already in the tree under axum and reqwest;
# these lines only make them direct. No default features on hyper-util: the pooled `legacy` client
# and its connectors are exactly the machinery this deliberately does without.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# Query-string parsing that decodes like Go's `url.ParseQuery` (percent-escapes and `+` as
# space). Already in the tree through reqwest → url; this only makes it a direct dependency.
form_urlencoded = "1"
tower = "0.5"

# Test-only: the parity suite has to *be* a websocket client to check what the hub emits, and the
# same version axum's `ws` feature already links is used so no second tungstenite enters the tree.
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
] }

# Database — Postgres only.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

# Serde
serde = { version = "1", features = ["derive"] }
# Never `preserve_order`: every Go `map[string]any` modelled as a `serde_json::Map` relies on the
# BTreeMap sort to match Go's sorted keys. Measured 2026-09-24: 49 failures across the full suite.
# A Go struct inside such a map goes through `WebSocketEvent::add_struct` instead (D-541).
serde_json = { version = "1", features = ["raw_value"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time — Go stores epoch milliseconds as i64; chrono is for conversion only.
chrono = "0.4"

# The IANA timezone database. Needed because `ScheduledPost.IsValid` validates
# `repeat_timezone` with `time.LoadLocation`, which is a *filesystem* lookup against the host's
# tzdata — so Go's accepted set is a deployment artifact, not a language property (see D-065).
# An embedded, case-sensitive IANA table is what a Linux Go server effectively answers, and it is
# also what `scheduled_post_recurrence.go`'s next-occurrence arithmetic will need. No default
# features: the serde and filesystem integrations are not used.
chrono-tz = { version = "0.10", default-features = false }

# Validation. The Go identifier regexes have non-obvious alternation
# (`^[a-z0-9]+([a-z\-0-9]+|(__)?)[a-z0-9]+$`); hand-rolling equivalents is where
# parity bugs come from, so match Go's RE2 with the regex crate instead.
regex = "1"

# The WHATWG encodings behind `golang.org/x/net/html/charset`, which a link preview decodes a
# fetched page through before reading its OpenGraph tags (`mm_model::go_charset`). x/text's
# `htmlindex` and encoding_rs implement the same specification; where their decoders disagree the
# port refuses rather than guessing, and `fixtures/behaviour_opengraph.json` sweeps every
# single-byte table against Go's.
encoding_rs = "0.8"

# CSPRNG for NewId / NewRandomString.
rand = "0.9"

# Constant-time comparison. `OAuthApp.validateConfidentialClientGrant` compares the client secret
# with `crypto/subtle.ConstantTimeCompare`, and that is a security property rather than an
# implementation detail: a short-circuiting `==` leaks the secret's length and its matching prefix
# through timing. Hand-rolling the loop is exactly the kind of thing that gets optimised back into
# a short-circuit by the compiler, so take the dependency.
subtle = "2"

# GetGroupNameFromUserIds hashes the sorted member ids with SHA-1 and hex-encodes the digest.
# The result is the channel's Name and is therefore persisted and on the wire, so it must match
# Go's crypto/sha1 bit for bit — this is a compatibility requirement, not a security choice.
sha1 = "0.10"

# Go's unicode.IsLetter is Unicode general category L. Rust's char::is_alphabetic is the
# Alphabetic *property*, which also covers Other_Alphabetic — so it accepts combining marks
# (U+0345 and friends) that Go rejects. The behavioural oracle caught this in IsValidId.
# std cannot express general categories, hence this data-only crate.

# Go's encoding/json special-cases []byte and emits base64 (StdEncoding, padded); serde_json
# emits an array of numbers. FileInfo.MiniPreview is a *[]byte on the wire, so the difference is
# `"AQID"` against `[1,2,3]` — measured, not assumed. Hand-rolling base64 is exactly the kind of
# thing that goes subtly wrong, so take the dependency.
base64 = "0.22"

# Password hashing. Both crates exist for ONE reason: `Users.Password` is shared with the running
# Go server, so the stored representation is a wire format like any other and must match
# byte-for-byte. See [D-108] and `crates/mm-app/src/password/`.
#
# `pbkdf2` is what a Mattermost server at the pinned SHA actually writes — `hashers.latestHasher`
# is `DefaultPBKDF2()`. `hmac`/`sha2` are its PRF. The `simple` feature is off: it emits
# password-hash crate PHC strings, and Go writes its OWN PHC dialect, which we build by hand.
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
# `oid`: `rsa::Pkcs1v15Sign::new::<Sha512>()` needs the digest's OID to build the DigestInfo
# prefix that PKCS#1 v1.5 signatures carry — the same prefix Go's `rsa.VerifyPKCS1v15` checks.
serde_yaml_ng = "0.10"
tar = "0.4"
flate2 = "1"
# zstd for the web client's compression (`mm_api::gzhttp`): Go's gzhttp prefers it.
zstd = { version = "0.13", default-features = false }
sha2 = { version = "0.10", features = ["oid"] }
# Licence verification: Mattermost signs a licence with RSA PKCS#1 v1.5 over SHA-512 and appends
# the 256-byte signature (channels/utils/license.go:71). `rsa` is the RustCrypto implementation;
# only the public-key verify path is used, so the timing caveats on its private-key operations do
# not apply here.
rsa = { version = "0.9", features = ["getrandom"] }
# The interactive-dialog trigger id is `clientTriggerId:userId:millis:` signed with the
# installation's P-256 key (`Systems.AsymmetricSigningKey`), SHA-256 digest, ASN.1 DER signature
# — `model.GenerateTriggerId` / `DecodeAndVerifyTriggerId` (integration_action.go:636, :664).
# `POST /actions/dialogs/open` verifies one before it publishes anything, and a verifier that
# cannot check the signature would open a dialog for anyone who can base64.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

# Plugin signatures: `verifyPlugin` checks a detached OpenPGP signature over the bundle with
# golang.org/x/crypto/openpgp (plugin_signature.go:121). A marketplace install is refused without
# one, so the route cannot be served without an OpenPGP reader. rpgp is pure Rust (MIT OR
# Apache-2.0); only packet parsing and signature verification are used, and
# `fixtures/behaviour_plugin_signature.json` pins its verdicts to Go's.
pgp = { version = "0.20", default-features = false }

# `bcrypt` is the LEGACY hasher, kept because rows written before Mattermost's PBKDF2 migration
# are still bcrypt and `GetHasherFromPHCString` still routes to it. Chosen over rolling blowfish
# by hand, and over `rust-crypto`, because it exposes `hash_with_salt` — which is what makes the
# parity test exact rather than structural: given Go's salt we can assert Go's whole string.
bcrypt = { version = "0.15", default-features = false, features = ["std"] }

# SanitizeFilename NFC-normalizes before truncating to 256 codepoints, so a decomposed name is a
# different length than its composed form: 200 * "e+combining acute" is 400 runes in and 200 out.
# Without normalization the Rust port truncates at a different point and stores a different name.
unicode-normalization = "0.1"

# Password hashing runs 600,000 SHA-256 iterations per hash — Go's real work factor, which the
# parity tests must use because the iteration count is part of what they match. Unoptimised these
# crates make `cargo test` take minutes rather than seconds, so build just them with optimisation
# even in dev/test. This changes no behaviour; it is the standard remedy for a crypto dependency
# in a debug build.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
# The web client compresses every static asset a browser fetches, some of them tens of megabytes
# (source maps); unoptimised, one such response takes seconds.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# `[profile.dev.package.*]` above does **not** reach `cargo test`: the test profile inherits
# `dev`'s settings but not its per-package overrides, so the crypto crates were still being
# compiled unoptimized for every test run. 42 password tests took 55 seconds because of it —
# PBKDF2 is 600,000 SHA-256 rounds per hash by design, and that cost is paid at debug speed.
# Optimizing dependencies only; our own crates keep debug builds and fast incremental rebuilds.
[profile.test.package."*"]
opt-level = 3

# goimage is the one workspace member that is optimised in dev and test builds too. Its oracle
# replays deflate at level 9, Lanczos resampling and both JPEG codecs over photo-sized images; at
# opt-level 0 that corpus takes minutes, and a dev server resizing an upload would take seconds.
# The float semantics do not change with the level: Rust never fuses or reorders float operations
# on its own, and every FMA this crate performs is an explicit `mul_add` (see `goimage::fma`).
[profile.dev.package.goimage]
opt-level = 3
[profile.test.package.goimage]
opt-level = 3
