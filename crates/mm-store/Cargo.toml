[package]
name = "mm-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mm-model.workspace = true

sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
# The DB-backed tests in tests/ need a runtime; they skip themselves unless MM_STORE_DB=1.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# `db_channel_members.rs` asks the running Go server the same question it asks this crate, so the
# two answers can be compared. Dev-only: nothing in the library speaks HTTP.
reqwest = { workspace = true, features = ["json"] }
