[package]
name = "gobwire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# DELIBERATELY NOT `license.workspace = true`. This crate is an original implementation of Go's
# documented `encoding/gob` wire format and depends on no Mattermost code; it is meant to be
# published on its own (docs/PLUGIN_PLAN.md, D3). It must never depend on an `mm-*` crate.
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "Go encoding/gob wire format for Rust: encoder, merge-decoding decoder, derive, and dynamic values"
keywords = ["gob", "go", "golang", "serialization", "rpc"]
categories = ["encoding", "network-programming"]
readme = "README.md"

[features]
default = ["derive"]
derive = ["dep:gobwire-derive"]
# Conversions between `GoTime` and chrono's `DateTime<FixedOffset>`.
chrono = ["dep:chrono"]


[dependencies]
thiserror.workspace = true
gobwire-derive = { path = "../gobwire-derive", version = "0.1.0", optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
