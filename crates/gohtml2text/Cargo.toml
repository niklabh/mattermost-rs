[package]
name = "gohtml2text"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# A port of github.com/jaytaylor/html2text (MIT) over a port of golang.org/x/net/html's parser
# (BSD-3-Clause). It contains no Mattermost code and must never depend on an `mm-*` crate.
license = "MIT AND BSD-3-Clause"
repository.workspace = true
description = "Byte-exact port of jaytaylor/html2text as Mattermost's mail sender calls it"

[dependencies]
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
