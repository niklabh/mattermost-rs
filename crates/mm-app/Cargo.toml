[package]
name = "mm-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mm-store.workspace = true
mm-model.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

# Password hashing — see the workspace manifest for why each is here.
pbkdf2.workspace = true
hmac.workspace = true
sha2.workspace = true
bcrypt.workspace = true
base64.workspace = true
rand.workspace = true
subtle.workspace = true

[dev-dependencies]
# Only to construct a `sqlx::Error` when testing the store-error-to-AppError mapping. The crate
# itself never touches sqlx — that is mm-store's business.
sqlx.workspace = true
tokio.workspace = true
# `db_channel_authorization.rs` puts each permission case to the running Go server as well as
# to this crate, and compares. Dev-only: nothing in the library speaks HTTP.
reqwest = { workspace = true, features = ["json"] }
