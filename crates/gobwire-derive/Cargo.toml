[package]
name = "gobwire-derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Not the workspace licence: see crates/gobwire/Cargo.toml.
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "#[derive(Gob)] for the gobwire crate"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
