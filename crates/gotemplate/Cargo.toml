[package]
name = "gotemplate"
version = "0.1.0"
edition.workspace = true
# Not the workspace value: `let` chains need 1.88, and `scripts/crates-preflight.sh --msrv` checks it.
rust-version = "1.88"
# A port of Go's standard-library `text/template` and `html/template` (BSD-3-Clause). It contains no
# Mattermost code and must never depend on an `mm-*` crate.
license = "BSD-3-Clause"
repository.workspace = true
description = "Byte-exact port of Go's text/template and html/template contextual escaper"
keywords = ["template", "go", "golang", "html", "escaping"]
categories = ["template-engine", "web-programming"]
readme = "README.md"
# The tests are left out: they read the Go-generated corpus under fixtures/, which does not ship.
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE*"]

[dependencies]
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
