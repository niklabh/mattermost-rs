[package]
name = "mm-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# DELIBERATELY NOT `license.workspace = true`. The workspace default is AGPL-3.0-only; this crate
# is the Apache-2.0 half of the split, because every line of it derives from `server/public/`,
# which upstream licenses under Apache-2.0. See ./LICENSE, the root NOTICE, and D-031.
# Remove this override the moment this crate takes anything from `server/channels/`.
license = "Apache-2.0"
repository.workspace = true

[dependencies]
# x/net/html's tokenizer (BSD-3-Clause), re-exported as `go_html`.
gohtml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true
encoding_rs.workspace = true
rand.workspace = true
subtle.workspace = true
# PKCE's S256 challenge is BASE64URL(SHA256(verifier)) — authorize.go:232.
sha2.workspace = true
sha1.workspace = true
base64.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# `serde_default_guard` parses the server crates' source to hold D-192 closed.
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
