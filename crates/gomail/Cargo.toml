[package]
name = "gomail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# A port of github.com/wneessen/go-mail's message writer (MIT) and of the Go standard library's
# net/mail, net/smtp, mime, mime/multipart and mime/quotedprintable (BSD-3-Clause) as Mattermost's
# platform/shared/mail drives them. The Mattermost call sequence lives in mm-app; this crate must
# never depend on an `mm-*` crate.
license = "MIT AND BSD-3-Clause"
repository.workspace = true
description = "Byte-exact port of the SMTP client and MIME writer behind Mattermost's mail"

[dependencies]
gohtml2text = { path = "../gohtml2text" }
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true

[dev-dependencies]
serde_json.workspace = true
