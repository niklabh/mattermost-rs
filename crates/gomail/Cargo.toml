[package]
name = "gomail"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# A port of github.com/wneessen/go-mail's message writer (MIT) and of the Go standard library's
# net/mail, net/smtp, mime, mime/multipart and mime/quotedprintable (BSD-3-Clause) as Mattermost's
# platform/shared/mail drives them. The Mattermost call sequence lives in mm-app; this crate must
# never depend on an `mm-*` crate.
license = "MIT AND BSD-3-Clause"
repository.workspace = true
description = "Byte-exact port of the SMTP client and MIME writer behind Mattermost's mail"
keywords = ["email", "smtp", "mime", "go", "golang"]
categories = ["email", "network-programming"]
readme = "README.md"
# The tests are left out: they read the Go-generated corpus under fixtures/, which does not ship.
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE*"]

[dependencies]
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
rand.workspace = true
tracing.workspace = true
# TLS for implicit TLS and STARTTLS: the rustls/ring stack already in the tree through reqwest
# and sqlx, without aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[features]
# The SMTP sink and transcript normaliser that mm-app's mail tests share (src/testing.rs). Test
# apparatus, not API: left out of the docs.rs build and of semver.
testing = []

[dev-dependencies]
serde_json.workspace = true
