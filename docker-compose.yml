# Development stack for the Strangler Fig migration.
#
# Two processes, ONE database. That shared database is the whole mechanism: the Rust server
# authenticates against the same `Sessions` rows the Go server writes, so a client holding a
# token minted by Go is authenticated by Rust without a second login.
#
#   postgres    :5432   the shared database — schema created and migrated by the Go server
#
# **The Go server is no longer a container.** It is built from the pinned reference SHA and run on
# the host by `scripts/go-server.sh`; the service below is kept, behind a profile, only as the
# fallback described in [D-167]. The published `11.11.0-rc1` image and `reference/mattermost/` are
# both "11.11.0" and are *not* the same code — rc1 answers `GET /api/v4/bots` with a `system_owned`
# field the pinned source has never heard of, and 404s routes the pinned source registers — so a
# route can disagree with the reference without either side being wrong. Building the reference is
# what makes "read the Go source" and "ask the forward target" the same question again.
#
# The Rust server (`mm-api`) runs on the host, not here, so it can be rebuilt without a
# container cycle. It listens on :8066 and forwards anything it does not serve to :8065.
#
#   docker compose up -d          # postgres only
#   scripts/go-server.sh start    # the pinned Go server on :8065
#   cargo run -p mm-api
#
# To fall back to the published image — which will not read a database the pinned build has
# migrated, so the volume has to be recreated first:
#
#   scripts/go-server.sh stop && docker compose --profile published-image up -d mattermost
#
# The Go server owns the schema. Never point a migration tool at this database from the Rust
# side — the two servers would race, and the Go server's migrations are the reference.

services:
  postgres:
    image: postgres:15-alpine
    # Both are parameterised so `scripts/stack.sh` can run **several independent stacks at once**
    # — one per worktree, which is what removes the global lock in `stack-lock.sh`. Stack 0 leaves
    # both at their defaults, so an existing checkout, its container and its volume are untouched.
    container_name: mmrs-postgres${MMRS_STACK_SUFFIX:-}
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    ports:
      - "${MMRS_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports ready during the init script's first boot, while the
      # database is still being created. Naming the database and user closes that window.
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # There is deliberately NO redis service here, and adding one will not work — measured
  # 2026-08-17, do not try it again. Setting `MM_CACHESETTINGS_CACHETYPE=redis` makes the Go
  # server connect to Redis successfully and then refuse to start:
  #
  #   failed to initialize platform: Redis cannot be used in an instance without a license
  #   or a license without clustering
  #
  # Note it is the GO SERVER that exits, not Redis — Redis starts, passes its healthcheck and
  # answers the PONG above; Mattermost then vetoes its own config at
  # channels/app/platform/service.go:380 and quits.
  #
  # The check ends `&& !ps.forceEnableRedis`, a BUILD-time functional option whose only caller is
  # Mattermost's test harness. So a stock image cannot be talked into it, but a server built from
  # the pinned source with `ForceEnableRedis()` can — which is the no-licence route to Redis cache
  # mode if stale-on-write ever starts to bite. See D-087.

  # Behind a profile, so `docker compose up -d` starts postgres alone. See the header: the forward
  # target is now `scripts/go-server.sh`, which builds the pinned reference SHA natively — no qemu,
  # and no wire-format disagreement with the source this project is porting.
  mattermost:
    profiles: ["published-image"]
    # No arm64 manifest is published, so the platform is forced and the container runs under
    # emulation on Apple silicon. It is slow to boot and fine for a forward target.
    #
    # On an **arm64 Linux** host there is no Rosetta and Docker registers no emulator by default,
    # so this container restart-loops with `exec /mattermost/bin/mattermost: exec format error`
    # and nothing else says why — the parity suites then either skip or fail against a forward
    # target that is not there. Register qemu once per boot of the host:
    #
    #   docker run --privileged --rm tonistiigi/binfmt --install amd64
    #
    # Check with `ls /proc/sys/fs/binfmt_misc/` — `qemu-x86_64` must be listed. Under qemu the Go
    # server takes ~20s to answer `/api/v4/system/ping` and the parity suite runs roughly three
    # times slower than on native amd64; that is the cost, not a fault.
    # PINNED, and it must stay pinned: `latest` was 11.10.0 while the reference tree is pinned by
    # SHA to 11.11.0, so every parity claim in this repo was measured against a server one minor
    # out of step without anyone noticing. See D-130.
    #
    # There is no final `11.11.0` image yet — the pinned SHA (2026-08-13) is pre-release, and the
    # only published artifacts for this minor are `11.11.0-rc1` and the moving `release-11.11`.
    # rc1 is the closest fixed tag. Move this to `11.11.0` when it ships, and recreate the volume
    # again: Mattermost's migrations are one-way, so a database migrated by a newer build cannot be
    # read by an older one.
    image: mattermost/mattermost-team-edition:11.11.0-rc1
    platform: linux/amd64
    container_name: mmrs-mattermost
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      # THE CONFIG STORE LIVES IN THE SHARED DATABASE, NOT ON THE CONFIG VOLUME. Setting MM_CONFIG
      # to a postgres DSN makes `config.IsDatabaseDSN` pick `config.DatabaseStore` over the file
      # store (config/store.go:91), which creates a `Configurations` table and writes the whole
      # `model.Config` into its `Value` column as JSON (config/database.go:211, via
      # `json.MarshalIndent`). Exactly one row has `Active` true.
      #
      # This is what lets the Rust server read the SAME configuration the Go server is running
      # on, rather than guessing at it. Before this, Go kept config in `config.json` on the
      # `mattermost-config` volume — a filesystem the Rust process cannot see — so the two
      # servers shared a database but not a configuration, and every ported permission check
      # that consults a setting was reading an assumption. That was D-156, and this line is
      # what closes it. Do not remove it to "simplify" the stack.
      #
      # The `mattermost-config` volume below is deliberately kept: the server still writes
      # non-config files there, and leaving it mounted keeps this change reversible by deleting
      # one line.
      MM_CONFIG: "postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      # Lets the slice create its first user through the API without an invite.
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      # The proxy is the only thing in front of this server in development; local-mode
      # sockets and rate limiting would both confuse the picture.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "false"
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config

volumes:
  postgres-data:
  mattermost-data:
  mattermost-config:
