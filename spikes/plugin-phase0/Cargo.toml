# Phase 0 of docs/PLUGIN_PLAN.md. Throwaway: excluded from the workspace, never published, and
# nothing depends on it. Its job is to answer three questions before real crates are designed.
[package]
name = "plugin-phase0"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
env_logger = "0.11"
base64 = "0.22"
futures = "0.3"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.14"
